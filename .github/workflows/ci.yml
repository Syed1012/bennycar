name: CI

on:
  pull_request:
    branches:
      - prod

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Build & run tests
        run: ./mvnw -B -ntp verify

      - name: Build services under services/
        shell: bash
        run: |
          set -euo pipefail
          if [ -d services ]; then
            shopt -s nullglob
            found=0
            for dir in services/*; do
              [ -d "$dir" ] || continue
              if [ -f "$dir/pom.xml" ]; then
                found=1
                echo "::group::Maven $dir"
                ./mvnw -B -ntp -f "$dir/pom.xml" verify
                echo "::endgroup::"
              else
                echo "Skipping $dir (no pom.xml)."
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "No Maven services found under services/."
            fi
          else
            echo "No services/ directory present."
          fi
