spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bennycar_db?currentSchema=vehicle_service
    username: admin
    password: bennyCar123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: vehicle_service
  main:
    allow-bean-definition-overriding: false

logging:
  level:
    root: INFO
    de.bennycar.vehicle: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8082

