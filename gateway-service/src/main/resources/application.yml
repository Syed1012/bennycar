server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
          filters:
            - AuthenticationFilter
        - id: vehicle-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/vehicles/**, /api/v1/brands/**, /api/v1/vehicle-types/**, /api/v1/customization-categories/**, /api/v1/customization-options/**
          filters:
            - AuthenticationFilter

security:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_VALUE_32_CHARS_MIN}

