# ========================================
# Vehicle Service - Development Profile
# ========================================
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ========================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bennycar_db?currentSchema=vehicle_service
    username: admin
    password: bennyCar123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: vehicle_service
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Security Configuration
security:
  jwt:
    secret: bennycar-dev-jwt-secret-key-minimum-32-characters-long

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

# Logging Configuration
logging:
  level:
    root: INFO
    de.bennycar.vehicle: DEBUG

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics


