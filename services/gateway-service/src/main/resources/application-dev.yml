# ========================================
# Gateway Service - Development Profile
# ========================================
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ========================================

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
          filters:
            - AuthenticationFilter
        - id: vehicle-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/vehicles/**, /api/v1/brands/**, /api/v1/vehicle-types/**, /api/v1/customization-categories/**, /api/v1/customization-options/**
          filters:
            - AuthenticationFilter
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - AuthenticationFilter
        - id: world-view-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/journeys/**, /api/v1/routes/**
          filters:
            - AuthenticationFilter

# Security Configuration
security:
  jwt:
    secret: bennycar-dev-jwt-secret-key-minimum-32-characters-long

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG

# Actuator Configuration
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

